<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{site_name}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:14px;color:#334155;line-height:1.6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1f5f9;">
<tr>
<td align="center" style="padding:40px 20px;">

<!-- Container -->
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06);border:1px solid #e2e8f0;overflow:hidden;max-width:600px;width:100%;">

<!-- Header (Nền trắng sáng, nổi bật Logo và chữ tối màu) -->
<tr>
<td align="center" style="padding:32px 40px 24px;background-color:#ffffff;border-bottom:1px solid #e2e8f0;">
	<img src="{{site_logo}}" alt="{{site_name}}" width="150" style="max-width:150px;height:auto;margin:0 auto 12px;display:block;" />
	<div style="font-size:18px;font-weight:700;color:#0f172a;letter-spacing:-0.3px;line-height:1.3;">{{site_name}}</div>
</td>
</tr>

<!-- Content -->
<tr>
<td style="padding:32px 40px;background-color:#ffffff;">
	{{content}}
</td>
</tr>

<!-- Footer -->
<tr>
<td style="padding:24px 40px;background-color:#f8fafc;border-top:1px solid #e2e8f0;text-align:center;">
	<p style="margin:0;font-size:12px;color:#64748b;line-height:1.5;">
		&copy; {{year}} {{site_name}} · <a href="{{site_url}}" style="color:#2563eb;text-decoration:none;font-weight:600;">{{site_url}}</a>
	</p>
</td>
</tr>

</table>
<!-- /Container -->

</td>
</tr>
</table>
</body>
</html>
